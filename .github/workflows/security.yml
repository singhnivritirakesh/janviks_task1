name: DevSecOps - Continuous Security Assurance

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 2 * * 1' # Weekly security audit every Monday at 02:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  # ---------------------------------------------------------------------------
  # 1. Software Composition Analysis (SCA)
  # ---------------------------------------------------------------------------
  dependency-scan:
    name: SCA - Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute NPM Security Audit
        run: npm audit --audit-level=high

  # ---------------------------------------------------------------------------
  # 2. Secret Scanning (Gitleaks)
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret Detection - Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code with Complete History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Action
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # ---------------------------------------------------------------------------
  # 3. Static Application Security Testing (SAST) - Semgrep
  # ---------------------------------------------------------------------------
  sast-scan:
    name: SAST - Semgrep Security Audit
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Semgrep Rulesets (OWASP Top 10 & Security Audit)
        run: |
          semgrep ci \
            --config=p/security-audit \
            --config=p/owasp-top-ten \
            --config=p/typescript \
            --sarif --output=semgrep-results.sarif || true

      - name: Upload SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep-results.sarif

  # ---------------------------------------------------------------------------
  # 4. Container Image & Dockerfile Scanning - Trivy
  # ---------------------------------------------------------------------------
  container-scan:
    name: Container Security - Trivy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build API Docker Image
        run: docker build -t playsphere-api:test -f Dockerfile.api .

      - name: Run Trivy Vulnerability Scanner on API Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'playsphere-api:test'
          format: 'sarif'
          output: 'trivy-api-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy Scanner on Dockerfiles (IaC & Misconfigurations)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          hide-progress: false
          format: 'table'
          severity: 'CRITICAL,HIGH'

  # ---------------------------------------------------------------------------
  # 5. Dynamic Application Security Testing (DAST) - OWASP ZAP Baseline
  # ---------------------------------------------------------------------------
  dast-scan:
    name: DAST - OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest
    needs: [dependency-scan]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and Build Application
        run: |
          npm ci
          npm run gen-keys
          npm run server:seed
          npm run build

      - name: Launch Application Stack in Background
        run: |
          npm run server:dev &
          sleep 5
          curl -f http://localhost:5000/api/health

      - name: Run OWASP ZAP Baseline Scan against Running API
        uses: zaproxy/action-baseline@v0.12.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          target: 'http://localhost:5000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          allow_issue_writing: false
