name: CI - Lint, Typecheck, Build & Security Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Code Quality & Automated Security Verification
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint (Zero Errors / Zero Warnings Policy)
        run: npm run lint

      - name: Verify TypeScript Types (Client & Server)
        run: |
          npx tsc --noEmit -p tsconfig.app.json
          npx tsc --noEmit -p server/tsconfig.json

      - name: Build Production Frontend Bundle
        run: npm run build

      - name: Generate Cryptographic Keys for Security Tests
        run: npm run gen-keys

      - name: Seed Security Testing Database
        run: npm run server:seed

      - name: Execute Automated Security Controls Test Suite (Vitest)
        run: npm run test:security
