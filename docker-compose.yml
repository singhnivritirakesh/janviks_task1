version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. Hardened Reverse Proxy (TLS Termination, Rate Limiting, CSP Injection)
  # ---------------------------------------------------------------------------
  proxy:
    image: nginx:1.27-alpine
    container_name: playsphere-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro
      - ./dist:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --no-check-certificate https://localhost/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------------------
  # 2. Hardened API Backend (Node.js / Express / RS256 / RBAC)
  # Unexposed to host network; accessible ONLY via proxy on frontend-net
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: playsphere-api
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - HOST=0.0.0.0
      - DATABASE_URL=postgres://playsphere_user:DefensivePass2026!Secure@db:5432/playsphere_prod
      - JWT_PRIVATE_KEY_PATH=/app/server/keys/jwt_private.pem
      - JWT_PUBLIC_KEY_PATH=/app/server/keys/jwt_public.pem
      - JWT_ACCESS_TOKEN_TTL_MINUTES=15
      - JWT_REFRESH_TOKEN_TTL_DAYS=7
      - JWT_ISSUER=playsphere-auth-service
      - JWT_AUDIENCE=playsphere-client
      - COOKIE_SECRET=playsphere-super-secure-cookie-key-32-chars!
      - COOKIE_SECURE=true
      - CORS_ALLOWED_ORIGINS=https://localhost,http://localhost
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=100
      - MAX_LOGIN_ATTEMPTS=5
      - LOCKOUT_DURATION_MINUTES=15
      - ALERT_FAILED_LOGIN_THRESHOLD=5
      - ALERT_FAILED_LOGIN_WINDOW_MINUTES=10
      - ALERT_UNAUTHORIZED_THRESHOLD=5
      - ALERT_UNAUTHORIZED_WINDOW_MINUTES=5
      - ALERT_DATA_EXPORT_THRESHOLD=100
    volumes:
      - ./server/keys:/app/server/keys:ro
      - app-logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend-net
      - backend-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------------------
  # 3. PostgreSQL Database (Encrypted Storage, Parameterized Queries)
  # Completely isolated on backend-net; NO port mapping to host
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: playsphere-db
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      POSTGRES_USER: playsphere_user
      POSTGRES_PASSWORD: DefensivePass2026!Secure
      POSTGRES_DB: playsphere_prod
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playsphere_user -d playsphere_prod"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true

# -----------------------------------------------------------------------------
# Isolated Docker Networks (Defense-in-depth segmentation)
# -----------------------------------------------------------------------------
networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
    internal: true # Disallow external internet access from database tier

# -----------------------------------------------------------------------------
# Persistent Volumes
# -----------------------------------------------------------------------------
volumes:
  pgdata:
    driver: local
  app-logs:
    driver: local
